services:
  - type: web
    name: cursoft-app
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.php
    dockerContext: .
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cursoft-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: RENDER
        value: true
      - key: BASE_PATH
        value: ""
      - key: PORT
        value: "10000"
    healthCheckPath: /health.php
    autoDeploy: true

databases:
  - name: cursoft-db
    databaseName: cursoft_prod
    user: cursoft_user
    plan: free
