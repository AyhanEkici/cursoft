# Docker Compose for Production
# Run: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # PHP/Apache Application
  app:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    container_name: cursoft-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    environment:
      - DB_HOST=db
      - DB_NAME=cursoft
      - DB_USER=cursoft_user
      - DB_PASS=${DB_PASSWORD}
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - db
    networks:
      - cursoft-network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: cursoft-db
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=cursoft
      - MYSQL_USER=cursoft_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d
    networks:
      - cursoft-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: cursoft-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../:/var/www/html
    depends_on:
      - app
    networks:
      - cursoft-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: cursoft-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cursoft-network
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: cursoft-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - cursoft-network
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  cursoft-network:
    driver: bridge

